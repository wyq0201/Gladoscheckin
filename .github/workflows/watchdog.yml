name: glados watchdog

# 只干一件事：今天彻底没跑（定时被 GitHub 丢了/延迟到快过期）时，兜底手动触发一次签到。
#
# 注意边界：
#   * 签到失败 / 积分异常 → 由 custom-checkin 自己触发 sync-upstream，这里不插手，
#     否则会每小时重复签到（重复签到不涨分，纯浪费）
#   * 凭据失效（cookie -2）→ 兜底也救不了，只能靠推送告警让人去换 cookie

on:
  workflow_dispatch:
    inputs:
      force_check:
        description: '测试用：忽略「今天已跑过」的判断，强制走一遍决策逻辑'
        type: boolean
        default: false
      dry_run:
        description: '测试用：只打印将要执行的动作，不真正触发签到'
        type: boolean
        default: false
  schedule:
    # 北京时间 16:00 / 19:00（UTC 08:00 / 11:00），一天只两次。
    #
    # 2026-11-11 收紧：原来是 `0 3-14 * * *`（北京 11:00-22:00，共 12 次），
    # 但实测 GitHub 对这个仓库的 schedule 严重降级 —— 11-10 那天 12 次只跑了 1 次，
    # 而且落地在 18:29 UTC（比区间末尾还晚 4.5 小时）。铺宽既没提高命中率，
    # 又拉长了一天里可能重复签到的时间段。所以改成两个点，且都排在主任务之后。
    #
    # 现在主任务由青龙 08:40 精确定时 dispatch（见 custom-checkin.yml 顶部说明），
    # 这里只是「青龙挂了 / 触发失败」的最后一道兜底。
    - cron: '0 8,11 * * *'

permissions:
  actions: write
  contents: read

concurrency:
  group: glados-watchdog
  cancel-in-progress: false

jobs:
  guard:
    name: glados guard
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Decide whether a rescue run is needed
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          FORCE_CHECK: ${{ github.event.inputs.force_check || 'false' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          TZ: Asia/Shanghai
        run: |
          set -uo pipefail

          today=$(date +%F)
          echo "北京时间今天: $today"
          echo "force_check=$FORCE_CHECK dry_run=$DRY_RUN"

          # 时间窗口守卫：GitHub 的 schedule 会延迟几小时甚至跨天，
          # 曾出现 22:00 那档延迟到次日 00:33 才执行 —— 那时兜底等于"半夜签明天的"，
          # 结果 08:40 正常定时再跑就变成重复签到。现在窗口跟着 cron 收紧到 16:00-23:00。
          hour=$(date +%H); hour=$((10#$hour))
          if [ "$FORCE_CHECK" != "true" ] && { [ "$hour" -lt 16 ] || [ "$hour" -gt 23 ]; }; then
            echo "::notice::当前北京时间 ${hour} 点，不在兜底窗口（16:00-23:00），跳过。多半是定时延迟到别处了。"
            exit 0
          fi

          gh workflow enable custom-checkin.yml --repo "$REPO" >/dev/null 2>&1 \
            && echo "已确认 custom-checkin.yml 处于启用状态" \
            || echo "::warning::启用 custom-checkin.yml 失败，请检查权限"

          gh run list --repo "$REPO" --workflow custom-checkin.yml --limit 50 \
            --json createdAt,status,conclusion > /tmp/runs.json

          done_today=0; pending=0; ok=0
          while read -r created status conclusion; do
            [ -n "$created" ] || continue
            d=$(date -d "$created" +%F 2>/dev/null) || continue
            [ "$d" = "$today" ] || continue
            case "$status" in
              queued|in_progress|requested|waiting|pending) pending=$((pending + 1)); continue ;;
            esac
            done_today=$((done_today + 1))
            [ "$conclusion" = "success" ] && ok=$((ok + 1))
          done < <(jq -r '.[] | "\(.createdAt) \(.status) \(.conclusion)"' /tmp/runs.json)

          echo "今天签到运行：已完成 $done_today（成功 $ok）/ 进行中 $pending"

          if [ "$FORCE_CHECK" != "true" ]; then
            if [ "$pending" -gt 0 ]; then
              echo "::notice::今天已有签到在排队或执行中，等待即可，不兜底。"
              exit 0
            fi
            if [ "$done_today" -gt 0 ]; then
              # 成功和失败都算「今天跑过了」：失败由 custom-checkin 自己触发上游同步，
              # 这里再补跑只会得到「重复签到」，不涨分。
              echo "::notice::今天已经跑过 $done_today 次（成功 $ok），不兜底。异常请查看推送/日志。"
              exit 0
            fi
          fi

          if [ "$DRY_RUN" = "true" ]; then
            echo "::warning::[dry_run] 本应触发兜底签到，已被跳过。"
            exit 0
          fi

          echo "::notice::今天还没有任何签到运行记录，触发兜底。"
          gh workflow run custom-checkin.yml --repo "$REPO" --ref master
          echo "兜底触发已提交。"

      - name: Cleanup old watchdog runs
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TZ: Asia/Shanghai
        run: |
          set -uo pipefail
          today=$(date +%F)
          gh run list --repo "$REPO" --workflow watchdog.yml --limit 100 \
            --json databaseId,createdAt,status > /tmp/wd.json 2>/dev/null || exit 0
          while read -r id created status; do
            [ "$status" = "completed" ] || continue
            d=$(date -d "$created" +%F 2>/dev/null) || continue
            if [ "$d" != "$today" ]; then
              gh run delete "$id" --repo "$REPO" >/dev/null 2>&1 || true
            fi
          done < <(jq -r '.[] | "\(.databaseId) \(.createdAt) \(.status)"' /tmp/wd.json)
          echo "清理完成。"
